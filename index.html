<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prompt Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    Design decisions carried in from the 16-round /gpt-review plan-
    convergence loop (full history: workstream LL doc,
    https://drive.google.com/file/d/1oCtGaFrMtgB_MC6Lc9q4SesuY5EXvXga/view):

    - Access control: this app has NO application-level authentication.
      It relies entirely on Vercel Deployment Protection (scoped to your
      own account only — see README). Mose's explicit decision, round 2,
      restated by review 12+ times with no new evidence.
    - Copy-count updates use a plain read-modify-write, not an atomic
      operation. Under genuinely concurrent requests (e.g. two open
      browser tabs) an increment can be lost. Mose's explicit decision,
      round 4 — client-side mitigation (the button below disables while
      a copy is in flight) plus documented acceptance, not an event-log
      redesign.
    - Duplicate-prompt creation has the same non-atomic, best-effort
      nature — a race between two create requests for the same new text
      can produce two records.
    - All prompt-derived text is rendered via textContent/DOM node
      creation ONLY, never innerHTML — a real XSS finding from round 2,
      fixed and held for the rest of the loop.
  -->
  <header>
    <h1>Prompt Tracker</h1>
    <div class="search-wrap">
      <svg
        class="search-icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
        <line
          x1="21"
          y1="21"
          x2="16.65"
          y2="16.65"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
      <input
        id="search"
        type="text"
        placeholder="Search or paste a prompt…"
        autocomplete="off"
      />
    </div>
  </header>

  <main>
    <section id="active-panel" hidden>
      <div id="active-panel-inner"></div>
    </section>

    <section id="create-panel" hidden>
      <button id="create-btn" type="button"></button>
    </section>

    <section id="library">
      <div id="library-warnings"></div>
      <ul id="library-list"></ul>
    </section>
  </main>

  <script src="lib/matching.js"></script>
  <script>
    (function () {
      "use strict";

      var state = {
        prompts: [],
        skippedCount: 0,
        truncated: false,
        loaded: false,
        query: "",
      };

      var searchEl = document.getElementById("search");
      var activePanel = document.getElementById("active-panel");
      var activePanelInner = document.getElementById("active-panel-inner");
      var createPanel = document.getElementById("create-panel");
      var createBtn = document.getElementById("create-btn");
      var libraryWarnings = document.getElementById("library-warnings");
      var libraryList = document.getElementById("library-list");

      function clearChildren(el) {
        while (el.firstChild) el.removeChild(el.firstChild);
      }

      // Un-hides a panel with a genuine entrance transition (fade +
      // slight upward slide) instead of an instant hidden->visible
      // toggle. A CSS transition can't animate across the
      // [hidden]-triggered display:none boundary on its own, so the
      // panel is un-hidden FIRST (making the .panel-entering starting
      // state actually take effect and lay out), then a forced reflow
      // (void panelEl.offsetWidth) makes the browser register that
      // starting state before the class is removed on the next line --
      // without the forced reflow, hiding and un-hiding the class in
      // the same frame would collapse into one state and the browser
      // would never observe (or animate) the transition at all.
      function revealPanel(panelEl) {
        panelEl.hidden = false;
        panelEl.classList.add("panel-entering");
        void panelEl.offsetWidth;
        panelEl.classList.remove("panel-entering");
      }

      function textEl(tag, text, className) {
        var el = document.createElement(tag);
        if (className) el.className = className;
        el.textContent = text; // textContent only — never innerHTML with
        // prompt-derived data (round 2 XSS fix, held for the rest of the
        // loop).
        return el;
      }

      function preview(text, n) {
        var codePoints = Array.from(text);
        if (codePoints.length <= n) return text;
        return codePoints.slice(0, n).join("") + "…";
      }

      async function fetchPrompts() {
        // Wrapped in try/catch — a network-level failure throws inside
        // fetch() itself, not just a non-ok response; previously
        // unhandled here, leaving the library silently blank with no
        // error shown (diff-review round 1 P1 finding).
        try {
          var res = await fetch("/api/prompts");
          if (!res.ok) {
            renderLibraryError("Could not load the prompt library.");
            return;
          }
          var data = await res.json();
          state.prompts = data.prompts || [];
          state.skippedCount = data.skippedCount || 0;
          state.truncated = Boolean(data.truncated);
          state.loaded = true;
          renderLibrary();
        } catch (e) {
          renderLibraryError("Could not load the prompt library.");
        }
      }

      function renderLibraryError(message) {
        clearChildren(libraryWarnings);
        libraryWarnings.appendChild(textEl("p", message, "warning"));
      }

      function renderLibrary() {
        clearChildren(libraryWarnings);
        if (state.skippedCount > 0) {
          libraryWarnings.appendChild(
            textEl(
              "p",
              state.skippedCount +
                " record(s) could not be loaded and are hidden from this view.",
              "warning"
            )
          );
        }
        if (state.truncated) {
          // Deliberately does NOT say "duplicate detection may be
          // incomplete" — that's server-side and independent of
          // truncation (see the create-panel comment below and
          // README.md's "Known limitations"). Only library BROWSING
          // and this page's own client-side exact-match hint are
          // affected by truncation (diff-review round 7 P2 finding —
          // this exact wording had already been corrected elsewhere,
          // round 4, but this specific instance was missed then).
          libraryWarnings.appendChild(
            textEl(
              "p",
              "Library may be incomplete (showing the first 5,000 records) — browsing and the live search hint below may be incomplete.",
              "warning"
            )
          );
        }

        clearChildren(libraryList);
        // Filtered/sorted by the CURRENT search query — previously
        // hardcoded to "" (matches everything), so the library never
        // actually reflected what you typed (diff-review round 1 P1
        // finding: live full-text search was advertised but not wired
        // up). state.query is kept in sync by the input listener below
        // and is untouched by re-renders triggered for other reasons
        // (e.g. a copy-count refresh), so the current filter is
        // preserved across those.
        var sorted = window.PromptMatching.filterPrompts(state.prompts, state.query);
        for (var i = 0; i < sorted.length; i++) {
          var p = sorted[i];
          var li = document.createElement("li");
          // Real <button>, not a bare click listener on the <li> — free
          // keyboard accessibility (focusable, activates on Enter/Space)
          // and matches every other interactive element in this app
          // (copyBtn, createBtn). This is the fix for the real UX gap
          // Mose hit live: the library view only ever showed a 60-char
          // preview with no way to select/copy a prompt directly — the
          // only path to the Copy button was retyping the prompt's full,
          // exact text into search, which is undiscoverable for anything
          // longer than the preview.
          var row = document.createElement("button");
          row.type = "button";
          row.className = "library-row";
          row.appendChild(textEl("span", preview(p.promptText, 60), "preview"));
          row.appendChild(textEl("span", String(p.count), "count"));
          row.addEventListener("click", function (prompt) {
            return function () {
              selectPromptFromLibrary(prompt);
            };
          }(p));
          li.appendChild(row);
          libraryList.appendChild(li);
        }
      }

      // Selecting a prompt directly from the library list — reuses the
      // exact same active-prompt panel + Copy button an exact search
      // match already shows, so there's only one display path for "a
      // prompt is active," not a second parallel one to keep in sync.
      // Deliberately does NOT touch state.query or the search box: a
      // library click is independent of whatever's currently typed
      // there, and typing something new afterward correctly re-runs
      // renderSearchState() and takes over the active panel again.
      function selectPromptFromLibrary(prompt) {
        createPanel.hidden = true;
        showActive(prompt);
      }

      var pendingDuplicateWarningText = null;

      function onSearchInput() {
        state.query = searchEl.value;
        renderLibrary();
        renderSearchState();
      }

      function renderSearchState() {
        var query = state.query;
        var result = window.PromptMatching.resolveSearchState(state.prompts, query);

        clearChildren(activePanelInner);
        activePanel.hidden = true;
        createPanel.hidden = true;

        if (result.state === "match") {
          showActive(result.prompt);
        } else if (result.state === "create") {
          // NOT gated on state.truncated. Round 12 of the plan review
          // disabled this when the library view was truncated, on the
          // premise that duplicate detection "can't see beyond the
          // loaded window" — but POST /api/prompts's own duplicate
          // check queries Notion directly by hash, server-side,
          // completely independent of what's loaded here; truncation
          // only affects this client-side exact-match HINT (which can
          // occasionally miss a match beyond the loaded window and
          // suggest "create" when one already exists). Gating create
          // on truncation blocked legitimate saves for no real
          // protective benefit specific to truncation (diff-review
          // round 2 P2 finding — corrected here and in README.md).
          // NOTE: the server-side check itself is still best-effort,
          // not a guarantee, independent of truncation entirely — see
          // README.md's "Known limitations" (capped at 10 hash-
          // matching candidates; can fail and fall through to create
          // rather than block the save). Worded precisely rather than
          // "always resolves to the existing record" (diff-review
          // round 4 P2 finding — the original wording here overclaimed
          // relative to README.md's own correct disclosure).
          clearChildren(createBtn);
          createBtn.appendChild(
            textEl("span", '+ Create new prompt with this text')
          );
          createBtn.onclick = function () {
            createPrompt(query);
          };
          revealPanel(createPanel);
        }
      }

      function showActive(prompt, note) {
        revealPanel(activePanel);
        clearChildren(activePanelInner);
        var pre = document.createElement("pre");
        var code = document.createElement("code");
        code.textContent = prompt.promptText; // textContent, never innerHTML
        pre.appendChild(code);
        activePanelInner.appendChild(pre);

        var copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.textContent = "Copy";
        activePanelInner.appendChild(copyBtn);

        var statusEl = textEl("span", "", "copy-status");
        activePanelInner.appendChild(statusEl);

        if (note) {
          activePanelInner.appendChild(textEl("p", note, "warning"));
        }

        copyBtn.addEventListener("click", function () {
          doCopy(prompt, copyBtn, statusEl);
        });
      }

      // Purely visual (Mode 3, no automated test -- same scope as the
      // rest of styles.css, which has no dedicated tests either). Adds
      // the CSS animation class, then removes it once the animation
      // genuinely finishes rather than on a guessed timeout -- avoids
      // ever leaving the class stuck if the browser throttles/skips the
      // animation (e.g. prefers-reduced-motion or a backgrounded tab),
      // and avoids re-triggering on a rapid double-click by restarting
      // cleanly each time (remove-then-reflow-then-add).
      function pulseSuccess(btn) {
        btn.classList.remove("pulse-success");
        void btn.offsetWidth; // force reflow so a restart is recognized
        btn.classList.add("pulse-success");
        btn.addEventListener(
          "animationend",
          function () {
            btn.classList.remove("pulse-success");
          },
          { once: true }
        );
      }

      async function doCopy(prompt, btn, statusEl) {
        btn.disabled = true;
        statusEl.textContent = "";
        try {
          await navigator.clipboard.writeText(prompt.promptText);
        } catch (e) {
          statusEl.textContent = "Clipboard copy failed.";
          btn.disabled = false;
          return;
        }
        // Clipboard succeeded — now track the copy. If tracking fails,
        // say so distinctly; never claim full success, never imply the
        // clipboard copy itself failed when it didn't (round 5/10 fix).
        try {
          var res = await fetch("/api/prompts/" + encodeURIComponent(prompt.id) + "/copy", {
            method: "POST",
          });
          if (!res.ok) {
            statusEl.textContent = "Copied! (tracking failed)";
          } else {
            var data = await res.json();
            statusEl.textContent = "Copied!";
            // Optimistic reconciliation: update the in-memory count from
            // the response, no forced full re-fetch (round 5 fix).
            prompt.count = data.count;
            prompt.lastUsed = data.lastUsed;
            renderLibrary();
            // Purely visual success feedback (a brief brighter-violet
            // glow pulse, see styles.css) -- fired ONLY on this genuinely-succeeded
            // branch, never on a tracking failure or clipboard failure.
            // Self-cleaning via animationend, independent of the
            // unrelated 1500ms status-text timeout below.
            pulseSuccess(btn);
          }
        } catch (e) {
          statusEl.textContent = "Copied! (tracking failed)";
        }
        setTimeout(function () {
          statusEl.textContent = "";
          btn.disabled = false;
        }, 1500);
      }

      async function createPrompt(text) {
        createBtn.disabled = true;
        try {
          var res = await fetch("/api/prompts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text }),
          });
          if (!res.ok) {
            var err = await res.json().catch(function () {
              return {};
            });
            alert(err.error || "Could not save the new prompt.");
            return;
          }
          var data = await res.json();
          // data.created === false means the server found an existing
          // record instead of making a new one (exact-match duplicate
          // detection, POST /api/prompts). Blindly pushing here would
          // add a second, duplicate row to the in-memory library any
          // time the client's own list is stale/truncated/skipped this
          // record — reconcile by id via the shared, unit-tested
          // upsertById helper instead of assuming "new" (diff-review
          // round 8 P2 finding).
          state.prompts = window.PromptMatching.upsertById(state.prompts, data.prompt);
          renderLibrary();
          var note = data.duplicateCheckIncomplete
            ? "Note: couldn't fully verify this isn't a duplicate — check the library if unsure."
            : null;
          createPanel.hidden = true;
          showActive(data.prompt, note);
        } catch (e) {
          // A network-level failure throws inside fetch() itself, not a
          // rejected/non-ok response — previously unhandled here, so a
          // network error left the button spinner-less with no feedback
          // at all (diff-review round 1 P1 finding).
          alert("Could not save the new prompt — a network error occurred.");
        } finally {
          createBtn.disabled = false;
        }
      }

      searchEl.addEventListener("input", onSearchInput);

      fetchPrompts();
    })();
  </script>
</body>
</html>
